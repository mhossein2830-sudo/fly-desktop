# fly.toml app configuration file generated for fly-desktop on 2026-08-30T06:38:04Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fly-desktop'
primary_region = 'fra'

[build]

[http_service]
  internal_port = 3389
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1024mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
